# Waffle: run with "docker compose up --build -d"
# One container: bot + API + dashboard (see Dockerfile).
services:
  waffle:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
    ports:
      # 127.0.0.1 = only this computer can open it. Put a reverse proxy or your
      # hosting platform in front when you make Waffle public.
      - "127.0.0.1:${API_PORT:-3003}:${API_PORT:-3003}"
    volumes:
      # Your database and its backups live in bot/data on your computer
      - ./bot/data:/app/data
